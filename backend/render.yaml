services:
  - type: web
    name: bail-reckoner-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
